# Builds the single-file game pages and publishes them to GitHub Pages.
# Runs on every push to main, or by hand from the Actions tab.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dist/
        working-directory: juego
        run: |
          sh build.sh
          sh build-miraflores.sh
          sh build-costaverde.sh
          sh build-barranco.sh
          sh build-cima.sh
          ls -la dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: juego/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
