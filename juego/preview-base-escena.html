<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>ACHORADO · escena del cuarto (D2)</title>
<style>body{background:#17141c;color:#e8e2d6;font:12px system-ui;margin:8px}canvas{image-rendering:pixelated;display:block;margin:4px 0}#err{color:#f88}</style></head><body>
<div id="err"></div><div id="bar"></div>
<script src="js/base/catalogo.js"></script><script src="js/base/arte-base.js"></script>
<script>
(function(){
