<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>ACHORADO · arte del malecón (Costa Verde, C2a)</title>
<style>
body{background:#17141c;color:#e8e2d6;font:12px/1.4 system-ui,sans-serif;margin:12px}
h2{font-size:14px;color:#ffd75e;margin:18px 0 6px}
.fila{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.c{display:flex;flex-direction:column;align-items:center;gap:2px}.c span{font-size:10px;color:#a89fb0}
canvas{image-rendering:pixelated;background:#8e8a80;display:block}
#err{color:#ff8a8a}
</style></head><body>
<h1 style="font-size:16px">Arte del malecón (ACH.sprites.cv.malecon) — ?sec=tiles|props|vista|quebrada|todo &amp;z=2 &amp;only=clave</h1><div id="err"></div><div id="info"></div>
<script src="js/sprites/base.js"></script>
<script src="js/costaverde/arte-malecon.js"></script>
<script>
(function(){
var qs=new URLSearchParams(location.search), Z=+qs.get('z')||3, SEC=qs.get('sec')||'todo', ONLY=qs.get('only'),OL=ONLY?ONLY.split(','):null;
window.addEventListener('error',function(e){document.getElementById('err').textContent+=e.message+' @'+e.lineno+' '});
var M=ACH.sprites.cv&&ACH.sprites.cv.malecon;
if(!M){document.getElementById('err').textContent='no hay ACH.sprites.cv.malecon';return;}
function sec(t){var h=document.createElement('h2');h.textContent=t;document.body.appendChild(h);var f=document.createElement('div');f.className='fila';document.body.appendChild(f);return f;}
function cel(f,c,name,z,bg,anchor){var d=document.createElement('div');d.className='c';var cv=document.createElement('canvas');cv.width=c.width;cv.height=c.height;var x=cv.getContext('2d');x.drawImage(c,0,0);
 if(anchor&&c.ax!==undefined){x.fillStyle='#ff00ff';x.fillRect(c.ax,c.ay,1,1);if(c.fw){x.strokeStyle='#00ffff';x.globalAlpha=.7;x.strokeRect(c.ax-c.fw/2+.5,c.ay-c.fh+.5,c.fw-1,c.fh);}}
 cv.style.width=c.width*z+'px';cv.style.height=c.height*z+'px';if(bg)cv.style.background=bg;d.appendChild(cv);var s=document.createElement('span');s.textContent=name+' '+c.width+'x'+c.height+(c.ax!==undefined?' ax'+c.ax+' ay'+c.ay+' fw'+c.fw+' fh'+c.fh:'');d.appendChild(s);f.appendChild(d);}
function isC(o){return o&&o.getContext;}
var TILE=['pasto','pastoFlor','caminoLadrillo','ciclovia','veredaCV','adoquinLetonia','losa','losaLinea','mosaicoPiso','pedestalBeso','tierraAmor','losetaTerracota','pastoCorazon','bordilloAmarillo'];
var VIS=['vista','quebradaBalta','parapenteCielo','tiles','timing','bakeMs','provided','meta'];
var f;
if(SEC==='tiles'||SEC==='todo'){
  f=sec('tiles (x'+Z+')');
  TILE.forEach(function(k){var v=M.tiles&&M.tiles[k];if(!v)return;if(OL&&OL.indexOf(k)<0)return;(Array.isArray(v)?v:[v]).forEach(function(c,i){cel(f,c,k+(Array.isArray(v)?'['+i+']':''),Z,null);});});
  // pruebas de encaje: bloques de 8x4 con variantes al azar
  f=sec('encaje de tiles (bloques 8x4, x2)');
  ['pasto','pastoFlor','caminoLadrillo','veredaCV','adoquinLetonia','losa','mosaicoPiso','pedestalBeso','tierraAmor','losetaTerracota','ciclovia'].forEach(function(k){
    var a=M.tiles[k]; if(!a)return; var c=document.createElement('canvas');c.width=128;c.height=64;var x=c.getContext('2d'),s=7;
    for(var j=0;j<4;j++)for(var i=0;i<8;i++){s=(s*1103515245+12345)&0x7fffffff;var n=(k==='adoquinLetonia'?(i<5?4:(i<7?0:6)):(s>>8)%a.length);x.drawImage(a[n%a.length],i*16,j*16);}
    cel(f,c,k,2,null);
  });
  // losa con lineas (cancha miniatura)
  var L=M.tiles.losaLinea,C=M.tiles.losa; if(L){var c2=document.createElement('canvas');c2.width=16*10;c2.height=16*6;var x2=c2.getContext('2d');
   for(var j2=0;j2<6;j2++)for(var i2=0;i2<10;i2++){var t=C[(i2*3+j2)%4];var ln=null;
     if(j2===0&&i2===0)ln=2;else if(j2===0&&i2===9)ln=3;else if(j2===5&&i2===0)ln=4;else if(j2===5&&i2===9)ln=5;else if(j2===0||j2===5)ln=0;else if(i2===0||i2===9)ln=1;
     if(i2===4&&j2===2)ln=6;if(i2===5&&j2===2)ln=7;if(i2===4&&j2===3)ln=8;if(i2===5&&j2===3)ln=9;
     x2.drawImage(t,i2*16,j2*16);if(ln!==null)x2.drawImage(L[ln],i2*16,j2*16);}
   cel(f,c2,'cancha (losa + losaLinea)',2,null);}
}
function drawGrid(c){return c;}
if(SEC==='props'||SEC==='todo'){
  f=sec('props (x'+(Z>2?2:Z)+'; magenta = ancla, cian = huella)');
  var PZ=+qs.get('pz')||2, names=Object.keys(M).filter(function(k){return TILE.indexOf(k)<0&&VIS.indexOf(k)<0&&k!=='tiles';});
  names.forEach(function(k){if(OL&&OL.indexOf(k)<0)return;var v=M[k];var arr=Array.isArray(v)?v:[v];arr.forEach(function(c,i){if(!isC(c))return;cel(f,c,k+(Array.isArray(v)?'['+i+']':''),PZ,'#8e8a80',true);
    if(c.broken&&isC(c.broken))cel(f,c.broken,k+'.broken',PZ,'#8e8a80',true); if(c.dark&&isC(c.dark))cel(f,c.dark,k+'.dark',PZ,'#8e8a80',true);});});
  if(M.parapenteCielo){f=sec('parapenteCielo');M.parapenteCielo.forEach(function(c,i){cel(f,c,'parapenteCielo['+i+']',PZ,'#a8aaa8',true);});}
}
function scene(w,h,zz,fn,label){var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.imageSmoothingEnabled=false;fn(x);cel(f,c,label,zz,'#303038');return c;}
if(SEC==='vista'||SEC==='todo'){
  f=sec('vista (480x270, x2): camY 0 / 200 / 480 ; t distinto');
  if(M.vista){var cx=+qs.get('camX')||0;
   [[0,544-120,0],[0,544+20,1.3],[1200,544+200,2.2],[0,544+480,3.4]].forEach(function(p,i){scene(480,270,2,function(x){x.fillStyle='#4a5a40';x.fillRect(0,0,480,270);M.vista.draw(x,p[0]+cx,p[1],p[2],480);},'camX '+(p[0]+cx)+' camY '+p[1]+' t '+p[2]);});}
}
if(SEC==='quebrada'||SEC==='todo'){
  f=sec('quebradaBalta (x1.5)');
  if(M.quebradaBalta){var q=M.quebradaBalta;scene(480,270,2,function(x){x.fillStyle='#4a5a40';x.fillRect(0,0,480,270);q.draw(x,q.x0-40,q.y0-10,0.5,480);},'quebrada camX x0-40 camY y0-10');
   scene(480,270,2,function(x){x.fillStyle='#4a5a40';x.fillRect(0,0,480,270);q.draw(x,q.x0+0,q.y0+140,1.5,480);},'quebrada camY y0+140');
   scene(480,270,2,function(x){x.fillStyle="#4a5a40";x.fillRect(0,0,480,270);M.vista.draw(x,q.x0-60,q.y0+210,1.5,480);q.draw(x,q.x0-60,q.y0+210,1.5,480);},"quebrada + vista camY y0+210");}
}
document.getElementById('info').textContent='horneado '+M.bakeMs+' ms · '+JSON.stringify(M.timing);
})();
</script></body></html>
