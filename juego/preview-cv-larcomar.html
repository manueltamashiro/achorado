<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACHORADO · Costa Verde · arte de Larcomar (C2b)</title>
<style>
  body { background: #17141c; color: #e8e2d6; font: 12px/1.35 system-ui, sans-serif; margin: 12px; }
  h1 { font-size: 16px; margin: 0 0 4px; } h2 { font-size: 14px; margin: 16px 0 6px; color: #ffd75e; }
  .fila { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 8px; }
  .celda { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
  .celda span { font-size: 10px; color: #a89fb0; max-width: 220px; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; background: #6b6b66; display: block; }
  canvas.sky { background: #8fa8b0; }
  #info { color: #9fd0a0; }
  button { font: inherit; }
</style>
</head>
<body>
<h1>Costa Verde · js/costaverde/arte-larcomar.js</h1>
<div id="info"></div>
<div id="out"></div>
<script>window.ACH = window.ACH || {}; ACH.cfg = ACH.cfg || {}; ACH.cfg.marcasReales = !/parodia=1/.test(location.search);</script>
<script src="js/sprites/base.js"></script>
<script src="js/sprites/marcas.js"></script>
<script>document.write('<script src="js/costaverde/arte-larcomar.js?v=' + Date.now() + '"><\/script>');</script>
<script>
(function () {
  'use strict';
  var qs = new URLSearchParams(location.search), Z = +qs.get('z') || 3, only = qs.get('solo'), bsel = qs.get('b') ? qs.get('b').split(',') : null;
  var out = document.getElementById('out'), L = ACH.sprites.cv && ACH.sprites.cv.larco;
  if (!L) { document.getElementById('info').textContent = 'FALTA ACH.sprites.cv.larco'; return; }
  function lienzo(src, k, cls) {
    var c = document.createElement('canvas'); c.width = src.width; c.height = src.height; c.getContext('2d').drawImage(src, 0, 0);
    c.style.width = (src.width * k) + 'px'; c.style.height = (src.height * k) + 'px'; if (cls) c.className = cls; return c;
  }
  function celda(row, label, src, k, cls) {
    var d = document.createElement('div'); d.className = 'celda';
    d.appendChild(lienzo(src, k || Z, cls)); var s = document.createElement('span'); s.textContent = label + ' ' + src.width + 'x' + src.height + (src.ax !== undefined ? ' @' + src.ax + ',' + src.ay : ''); d.appendChild(s); row.appendChild(d);
  }
  function seccion(t) { var h = document.createElement('h2'); h.textContent = t; out.appendChild(h); var r = document.createElement('div'); r.className = 'fila'; out.appendChild(r); return r; }
  var t0 = performance.now();
  var W = { nike: 6, bananarepublic: 6, tanta: 5, mangos: 6, koasian: 5, popular: 5, bonbonniere: 6, fridays: 6, pardos: 5, cinepolis: 8, hm: 5, miniso: 5, adidas: 5, starbucks: 5, freddo: 4, cinnabon: 5, salazar: 8, haagendazs: 5, masterkong: 5, kiosco: 4, deportes: 6, fuente: 4, granDragon: 7 };
  [true, false].forEach(function (modo) {
    if (only && only !== 'fachadas') return;
    ACH.px.setMarcas(modo);
    var row = seccion('Fachadas · ' + (modo ? 'MODO REAL' : 'MODO PARODIA'));
    L.brands.forEach(function (b) { if (bsel && bsel.indexOf(b) < 0) return; var f = L.fachada(b, W[b] || 5); celda(row, b + ' · ' + L.brandName(b), f.cv, Z); });
  });
  ACH.px.setMarcas(!/parodia=1/.test(location.search));
  function mosaico(tiles, cols, rows, k) {   // prueba de repeticion
    var c = document.createElement('canvas'); c.width = cols * 16; c.height = rows * 16; var g = c.getContext('2d');
    for (var j = 0; j < rows; j++) for (var i = 0; i < cols; i++) g.drawImage(tiles[(i * 3 + j * 5 + (i ^ j)) % tiles.length], i * 16, j * 16);
    return c;
  }
  if (!only || only === 'tiles') {
    var rt = seccion('Tiles (16x16) y su repeticion');
    ['pisoLarco', 'deck', 'escalera', 'paredRoca', 'pisoChifa'].forEach(function (n) {
      L.tiles[n].forEach(function (t, i) { celda(rt, n + '[' + i + ']', t, 5); });
      rt = seccion(n + ' x repeticion');
      celda(rt, n + ' 8x4', mosaico(L.tiles[n], 8, 4), 3);
      rt = seccion('');
    });
  }
  if (!only || only === 'props') {
    var rp = seccion('Props');
    Object.keys(L.props).forEach(function (n) {
      var p = L.props[n]; celda(rp, n + ' fw' + p.fw + ' fh' + p.fh + (p.lamp ? ' lamp' : ''), p, Z, 'sky');
      if (p.broken) celda(rp, n + '.broken', p.broken, Z, 'sky'); if (p.open) celda(rp, n + '.open', p.open, Z, 'sky');
    });
  }
  if (!only || only === 'lotes') {
    var rl = seccion('Lotes lado tierra (N = fachada al sur, S = azotea)');
    var fich = [
      ['cv_torre teal 7x10', { arch: 'cv_torre', side: 'N', c0: 0, c1: 6, r0: 0, r1: 9, seed: 11, floors: 14, name: 'NUMEN TOWER' }],
      ['cv_torre teal 5x10', { arch: 'cv_torre', side: 'N', c0: 0, c1: 4, r0: 0, r1: 9, seed: 12, floors: 10 }],
      ['cv_torre crema 6x10', { arch: 'cv_torre', side: 'N', c0: 0, c1: 5, r0: 0, r1: 9, seed: 13, floors: 8, color: 'crema' }],
      ['cv_torre salmon 6x10', { arch: 'cv_torre', side: 'N', c0: 0, c1: 5, r0: 0, r1: 9, seed: 14, floors: 9, color: 'salmon' }],
      ['cv_casona 6x8', { arch: 'cv_casona', side: 'N', c0: 0, c1: 5, r0: 0, r1: 7, seed: 15, face: 6 }],
      ['cv_casona salmon 7x8', { arch: 'cv_casona', side: 'N', c0: 0, c1: 6, r0: 0, r1: 7, seed: 16, face: 6, color: 'salmon' }],
      ['cv_hotel JW 10x10', { arch: 'cv_hotel', side: 'N', c0: 0, c1: 9, r0: 0, r1: 9, seed: 17, floors: 18, name: 'JW MARRIOTT' }],
      ['cv_torre S', { arch: 'cv_torre', side: 'S', c0: 0, c1: 6, r0: 0, r1: 5, seed: 18, name: 'TORRE' }],
      ['cv_casona S', { arch: 'cv_casona', side: 'S', c0: 0, c1: 5, r0: 0, r1: 5, seed: 19 }],
      ['cv_hotel S', { arch: 'cv_hotel', side: 'S', c0: 0, c1: 9, r0: 0, r1: 6, seed: 20, name: 'JW MARRIOTT' }]
    ];
    fich.forEach(function (it) { var r = ACH.sprites.buildLot(it[1]); if (!r) { celda(rl, it[0] + ' (SIN LOTE)', document.createElement('canvas'), 1); return; } celda(rl, it[0] + ' luces:' + r.lights.length, r.canvas, Math.max(1, Z - 1)); });
  }
  if (!only || only === 'escena') {
    var re = seccion('Escena de prueba: terraza A (pared norte con tiendas, piso, baranda y mar)');
    var sc = document.createElement('canvas'); sc.width = 480; sc.height = 270; var g2 = sc.getContext('2d'); g2.imageSmoothingEnabled = false;
    var x, y; for (y = 0; y < 17; y++) for (x = 0; x < 30; x++) g2.drawImage(y < 4 ? L.tiles.paredRoca[(x + y) % 4] : L.tiles.pisoLarco[(x * 3 + y * 7) % 4], x * 16, y * 16);
    var seq = ['nike', 'bananarepublic', 'tanta', 'mangos', 'koasian'], wt = [5, 6, 5, 6, 5], px0 = 0;
    for (var i = 0; i < seq.length && px0 < 480; i++) { var f = L.fachada(seq[i], wt[i]); g2.drawImage(f.cv, px0, 78 - f.ay + 0); px0 += f.cv.width; }
    g2.fillStyle = '#26566e'; g2.fillRect(0, 230, 480, 40); for (x = 0; x < 30; x++) g2.drawImage(L.props.barandaVidrio, x * 16, 230 - 21);
    g2.drawImage(L.props.letreroLarcomar, 150, 150); g2.drawImage(L.props.macetaLarco, 70, 100); g2.drawImage(L.props.sombrillaTerraza, 330, 120); g2.drawImage(L.props.mesaSalazar, 360, 170);
    celda(re, 'escena 480x270', sc, 2);
  }
  document.getElementById('info').textContent = 'horneado fachadas (2 modos): ' + (performance.now() - t0).toFixed(0) + ' ms · tiles+props: ' + L.bakeMs + ' ms · zoom ' + Z + ' (?z=N, ?solo=fachadas|tiles|props|lotes, ?parodia=1)';
  window.__celda = celda; window.__seccion = seccion;
})();
</script>
</body>
</html>
