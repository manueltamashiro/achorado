<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACHORADO - hoja de sprites</title>
<style>
  :root { --bg:#2a2833; --panel:#34323f; --ink:#e9e4d4; --dim:#9a97a6; --line:#4a4757; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px 20px 60px; background:var(--bg); color:var(--ink); font:13px/1.35 ui-monospace, Menlo, Consolas, monospace; }
  h1 { margin:0 0 4px; font-size:20px; }
  h2 { margin:28px 0 8px; padding-top:10px; border-top:1px solid var(--line); font-size:15px; color:#f2e63c; }
  p.note { margin:0 0 8px; color:var(--dim); max-width:900px; }
  nav a { color:#38c8e8; margin-right:12px; text-decoration:none; }
  .grid { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-start; }
  figure { margin:0; padding:6px; background:var(--panel); border:1px solid var(--line); border-radius:3px; }
  figcaption { margin-top:4px; max-width:100%; font-size:11px; color:var(--dim); overflow-wrap:anywhere; }
  figcaption b { color:var(--ink); font-weight:600; }
  canvas { display:block; image-rendering:pixelated; image-rendering:crisp-edges; }
  .chk { background-color:#6e6c78; background-image:linear-gradient(45deg,#625f6d 25%,transparent 25%,transparent 75%,#625f6d 75%),linear-gradient(45deg,#625f6d 25%,transparent 25%,transparent 75%,#625f6d 75%); background-size:16px 16px; background-position:0 0,8px 8px; }
  .row { display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap; margin:6px 0; }
  .bad { color:#ff8a2a; }
  .lot figure { padding:6px 6px 4px; }
  label { margin-right:12px; color:var(--dim); }
</style>
</head>
<body>
<h1>ACHORADO - hoja de sprites</h1>
<p class="note">Todo a ×4 (los lotes a ×3) sobre cuadros grises. En las props, Alexander (20×28, 1,70 m) va al lado sobre una regla donde 16 px = 1 m. Abre este archivo desde <code>dist/preview.html</code> o directo desde la carpeta.</p>
<nav id="nav"></nav>
<div id="out"></div>

<script src="js/sprites/base.js"></script>

<script src="js/sprites/edificios-industria.js"></script>
<script src="js/sprites/vehiculos.js"></script>

<script src="js/sprites/objetos.js"></script>

<script>
(function () {
"use strict";
var S = ACH.sprites, px = ACH.px, Z = 4;
var out = document.getElementById('out'), nav = document.getElementById('nav');

function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function isCanvas(o) { return o && typeof o === 'object' && typeof o.getContext === 'function' && o.width > 0; }
function show(c, z) {                                  // copia visible del canvas, con zoom entero y sin suavizado
  var v = document.createElement('canvas'); v.width = c.width; v.height = c.height;
  v.getContext('2d').drawImage(c, 0, 0);
  v.style.width = (c.width * z) + 'px'; v.style.height = (c.height * z) + 'px';
  v.className = 'chk';
  return v;
}
function fig(canvasEl, caption) { var f = el('figure'); f.appendChild(canvasEl); f.appendChild(el('figcaption', '', caption)); return f; }
function section(id, title, note) {
  var h = el('h2', '', title); h.id = id; out.appendChild(h);
  var a = el('a', '', title.split(' (')[0]); a.href = '#' + id; nav.appendChild(a);
  if (note) out.appendChild(el('p', 'note', note));
  var d = el('div', 'grid'); out.appendChild(d); return d;
}
function walk(o, path, acc, depth) {                    // junta todos los canvas de un arbol: { 'props.combi': canvas, 'props.car[0]': canvas ... }
  if (isCanvas(o)) { acc.push({ key: path, c: o }); return; }
  if (!o || typeof o !== 'object' || depth > 6) return;
  if (Array.isArray(o)) { o.forEach(function (v, i) { walk(v, path + '[' + i + ']', acc, depth + 1); }); return; }
  Object.keys(o).forEach(function (k) { walk(o[k], path ? path + '.' + k : k, acc, depth + 1); });
}
function meta(it) {
  var c = it.c, s = '<b>' + it.key + '</b><br>' + c.width + '×' + c.height;
  if (c.ax !== undefined) s += ' · ancla ' + c.ax + ',' + c.ay;
  if (c.fw !== undefined) s += ' · huella ' + c.fw + '×' + c.fh;
  if (c.tall) s += ' · tall';
  if (c.lamp) s += ' · lamp ' + c.lamp.x + ',' + c.lamp.y;
  return s;
}

/* ---- Alexander junto a una prop, sobre una regla en metros (16 px = 1 m) ---- */
function alexRef() { var a = S.alex && S.alex.nobird && S.alex.nobird.idle && S.alex.nobird.idle.down; return a || null; }
function withAlex(p) {
  var al = alexRef(), ax = p.ax !== undefined ? p.ax : (p.width >> 1), ay = p.ay !== undefined ? p.ay : p.height - 1;
  var aax = al ? (al.ax !== undefined ? al.ax : 10) : 0, aay = al ? (al.ay !== undefined ? al.ay : 26) : 0;
  var up = Math.max(ay, aay) + 4, gap = 12, left = 14;
  var W = left + p.width + gap + (al ? al.width : 0) + 6, rulerH = 14;
  var below = Math.max(p.height - 1 - ay, al ? al.height - 1 - aay : 0) + 3;
  var H = up + below + rulerH;
  var c = px.canvas(W, H), g = c.getContext('2d');
  var base = up;                                         // fila del suelo
  g.fillStyle = '#6e6c78'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#625f6d'; g.fillRect(0, base, W, below + rulerH);          // suelo
  var px0 = left + 0, py0 = base - ay;
  g.drawImage(p, px0, py0);
  if (p.fw !== undefined) { g.strokeStyle = 'rgba(255,207,138,.9)'; g.lineWidth = 1; g.strokeRect(px0 + ax - Math.floor(p.fw / 2) + .5, base - p.fh + .5, p.fw - 1, p.fh - 1); }
  if (al) g.drawImage(al, left + p.width + gap - 0, base - aay);
  // regla horizontal desde el ancla: cada 16 px = 1 m
  var ry = base + below + 2;
  g.fillStyle = '#e9e4d4'; g.fillRect(left, ry, W - left - 2, 1);
  var gl = new px.G(40, 6), mx = 0;
  for (var x = left, m = 0; x <= W - 3; x += 16, m++) {
    g.fillStyle = '#e9e4d4'; g.fillRect(x, ry - (m % 5 === 0 ? 3 : 2), 1, m % 5 === 0 ? 4 : 3);
    if (m % 2 === 0 && m > 0) { gl = new px.G(12, 6); px.text(gl, String(m), 0, 1, { font: 'a5', ink: '#e9e4d4' }); g.drawImage(gl.toCanvas(), x + 2, ry + 2); }
  }
  // regla vertical (a la izquierda): 16 px por metro hasta 2,2 m; despues 12 px/m
  g.fillStyle = '#e9e4d4'; g.fillRect(4, base - 16 * 2 - 12 * 3, 1, 16 * 2 + 12 * 3);
  for (var k = 1; k <= 2; k++) g.fillRect(2, base - 16 * k, 5, 1);
  for (k = 1; k <= 3; k++) { g.fillStyle = '#ffcf8a'; g.fillRect(3, base - 32 - 12 * k, 3, 1); }
  return c;
}

/* ================= Secciones =================
   props, tiles, decals, npc, zombie, alex, titina, y cualquier otra clave nueva. */
var KNOWN = ['props', 'tiles', 'decals', 'npc', 'zombie', 'alex', 'titina', 'fx', 'light', 'lots'];
var all = []; walk(S, '', all, 0);
var byTop = {};
all.forEach(function (it) { var t = it.key.split(/[.\[]/)[0]; (byTop[t] = byTop[t] || []).push(it); });
var order = ['props', 'tiles', 'decals', 'npc', 'zombie', 'alex', 'titina'].concat(Object.keys(byTop).filter(function (k) { return ['props', 'tiles', 'decals', 'npc', 'zombie', 'alex', 'titina'].indexOf(k) < 0; }));
var missingNote = [];
order.forEach(function (top) {
  var list = byTop[top]; if (!list) return;
  var d = section('s-' + top, top + ' (' + list.length + ' canvas)', top === 'props' ? 'Cada prop junto a Alexander; el recuadro naranja es la huella de colisión (fw×fh) en el suelo. Los números de la regla son metros.' : '');
  list.forEach(function (it) {
    var c = it.c;
    if (top === 'props') { var comp = withAlex(c); d.appendChild(fig(show(comp, Z), meta(it))); }
    else d.appendChild(fig(show(c, Z), meta(it)));
  });
});

/* ================= v0.6 (F3): estados de daño, rotos, gatos, ítems, resortera, orquesta, ventanas ================= */
(function () {
  var P = S.props || {};
  function get(k) { var c = P[k[0]]; if (k.length > 1) c = c && c[k[1]]; return c; }
  function nm(k) { return k.length > 1 ? k[0] + '[' + k[1] + ']' : k[0]; }
  function strip(cvs, z, bg) { var w = el('div'); w.style.cssText = 'display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap'; cvs.forEach(function (c) { if (c) w.appendChild(show(c, z)); }); return w; }
  function same(a, b) { return a.width === b.width && a.height === b.height && a.ax === b.ax && a.ay === b.ay && a.fw === b.fw && a.fh === b.fh; }
  /* ---- vehículos ---- */
  var d = section('s-dmg', 'vehículos: estados de daño (.dmg)', 'Cada fila: sano · c1 abolladuras y parabrisas rajado · c2 lunas rotas con esquirlas, faro colgando, paragolpes torcido, rayones · c3 carcasa: techo hundido, sin vidrio, llantas bajas, óxido y hollín. Mismo lienzo, ancla y huella.');
  [['combiE', 0], ['combiE', 1], ['combiE', 2], ['combiW', 0], ['custerE'], ['custerW'], ['carVar', 0], ['carVar', 1], ['carVar', 2], ['carVarW', 1], ['tico', 0], ['tico', 1], ['ticoW', 0],
   ['mototaxiVar', 0], ['mototaxiVar', 1], ['mototaxiVar', 2], ['mototaxiVarW', 2], ['mototaxi'], ['combiN', 0], ['combiN', 1], ['combiS', 0], ['combiS', 2], ['car']].forEach(function (k) {
    var c = get(k);
    if (!c || !c.dmg) { d.appendChild(fig(el('div', 'bad', 'sin .dmg'), nm(k))); return; }
    var ok = c.dmg.length === 3 && c.dmg.every(function (x) { return same(c, x); });
    d.appendChild(fig(strip([c].concat(c.dmg), c.width > 90 ? 2 : (c.width > 50 ? 3 : 4)), '<b>' + nm(k) + '</b> · ' + c.width + '×' + c.height + ' · ancla ' + c.ax + ',' + c.ay + ' · huella ' + c.fw + '×' + c.fh + ' · sano · c1 · c2 · c3' + (ok ? '' : ' <span class="bad">¡TAMAÑO/ANCLA DISTINTO!</span>')));
  });
  /* ---- rotos y apagados ---- */
  var d2 = section('s-broken', 'rotos (.broken) y postes apagados (.dark)', 'Izquierda: sano; derecha: estado roto o apagado. Los rotos conservan el ancla y achican la huella; .dark es la luminaria muerta con el cable colgando.');
  [['trash'], ['bags'], ['bolsas', 0], ['bolsas', 1], ['emoliente'], ['anticuchos'], ['quiosco'], ['triciclo']].forEach(function (k) {
    var c = get(k); if (!c || !c.broken) { d2.appendChild(fig(el('div', 'bad', 'sin .broken'), nm(k))); return; }
    d2.appendChild(fig(strip([c, c.broken], 4), '<b>' + nm(k) + '.broken</b> · ' + c.broken.width + '×' + c.broken.height + ' · ancla ' + c.broken.ax + ',' + c.broken.ay + ' (sano ' + c.ax + ',' + c.ay + ') · huella ' + c.broken.fw + '×' + c.broken.fh + ' (sano ' + c.fw + '×' + c.fh + ')'));
  });
  [['poste'], ['posteCables'], ['posteAfiche'], ['posteAfiches', 2], ['posteLuz', 0], ['posteLuz', 1]].forEach(function (k) {
    var c = get(k); if (!c || !c.dark) { d2.appendChild(fig(el('div', 'bad', 'sin .dark'), nm(k))); return; }
    var cut = function (cv) { var o = px.canvas(cv.width, 80); o.getContext('2d').drawImage(cv, 0, 0, cv.width, 80, 0, 0, cv.width, 80); return o; };
    d2.appendChild(fig(strip([cut(c), cut(c.dark)], 4), '<b>' + nm(k) + '.dark</b> · mitad alta del poste, sano a la izquierda, apagado a la derecha · lamp ' + (c.lamp ? c.lamp.x + ',' + c.lamp.y : '-')));
  });
  /* ---- gatos ---- */
  var N = S.npc || {}, d3 = section('s-gatos', 'gatos (npc.gato y npc.gatoVar[3])', 'sentado · lamiéndose · caminar der/izq · correr der/izq · escondido (solo ojos y punta de cola). 14×10, ancla en los pies. Fila de abajo: tamaño real.');
  [N.gato].concat(N.gatoVar || []).forEach(function (c, i) {
    if (!c) return;
    d3.appendChild(fig(strip([].concat(c.sit, c.lick), 6), '<b>' + (i === 0 ? 'gato' : 'gatoVar[' + (i - 1) + ']') + '</b> · sit[' + c.sit.length + '] lick[' + c.lick.length + '] · ' + c.sit[0].width + '×' + c.sit[0].height + ' ancla ' + c.sit[0].ax + ',' + c.sit[0].ay));
    d3.appendChild(fig(strip([].concat(c.walk.right, c.walk.left), 6), 'walk right[' + c.walk.right.length + '] · left[' + c.walk.left.length + ']'));
    d3.appendChild(fig(strip([].concat(c.run.right, c.run.left), 6), 'run right[' + c.run.right.length + '] · left[' + c.run.left.length + ']'));
    d3.appendChild(fig(strip([].concat(c.hide), 6), 'hide[' + c.hide.length + '] (sobre fondo oscuro)'));
  });
  var oneRow = el('div', 'row'); (N.gatoVar || []).forEach(function (c) { oneRow.appendChild(show(c.sit[0], 1)); oneRow.appendChild(show(c.walk.right[0], 1)); oneRow.appendChild(show(c.run.right[1], 1)); });
  d3.appendChild(fig(oneRow, 'a 1× (los tres pelajes)'));
  /* ---- ítems ---- */
  var I = S.items || {}, d4 = section('s-items', 'ítems (items[id] 12×12 y .big 24×24)', 'Cada ítem: ×8 (12×12), ×4 (.big 24×24), a 1× sobre claro y oscuro, y a 2×. El gaseosa usa ACH.px.marca(\'gaseosa_amarilla\') si existe.');
  Object.keys(I).forEach(function (id) {
    var c = I[id], w = el('div'); w.style.cssText = 'display:flex;gap:10px;align-items:flex-end';
    w.appendChild(show(c, 8)); if (c.big) w.appendChild(show(c.big, 4));
    var small = el('div'); small.style.cssText = 'display:flex;gap:4px;align-items:flex-end;padding:4px;background:#d8d4c4';
    small.appendChild((function () { var v = show(c, 1); v.className = ''; return v; })()); if (c.big) small.appendChild((function () { var v = show(c.big, 1); v.className = ''; return v; })());
    var dark = el('div'); dark.style.cssText = 'display:flex;gap:4px;align-items:flex-end;padding:4px;background:#24222c';
    dark.appendChild((function () { var v = show(c, 2); v.className = ''; return v; })());
    w.appendChild(small); w.appendChild(dark);
    d4.appendChild(fig(w, '<b>items.' + id + '</b> · ' + c.width + '×' + c.height + (c.big ? ' · big ' + c.big.width + '×' + c.big.height : ' <span class="bad">sin .big</span>') + ' · ancla ' + c.ax + ',' + c.ay));
  });
  /* ---- resortera ---- */
  var d5 = section('s-sling', 'Alexander con resortera (alex.bird/nobird.sling[dir] = [estirar, soltar])', 'Primero el cuadro de ataque (referencia de tamaño y ancla), luego estirar y soltar. Misma anchura, altura y ancla que attack. Arriba con Titina, abajo sin.');
  ['bird', 'nobird'].forEach(function (v) {
    var A = S.alex && S.alex[v]; if (!A || !A.sling) { d5.appendChild(fig(el('div', 'bad', 'sin sling'), v)); return; }
    ['right', 'left', 'down', 'up'].forEach(function (dir) {
      var atk = A.attack[dir][0], sl = A.sling[dir], ok = sl.length === 2 && sl.every(function (c) { return same(atk, c); });
      d5.appendChild(fig(strip([atk, sl[0], sl[1]], 5), '<b>' + v + '.sling.' + dir + '</b> · ' + sl[0].width + '×' + sl[0].height + ' ancla ' + sl[0].ax + ',' + sl[0].ay + ' (attack ' + atk.width + '×' + atk.height + ' @' + atk.ax + ',' + atk.ay + ')' + (ok ? '' : ' <span class="bad">¡DISTINTO!</span>')));
    });
  });
  /* ---- orquesta, baile, tarima, ventanas ---- */
  var Zb = S.zombie || {}, d6 = section('s-orquesta', 'orquesta zombie, bailarín y escenario', 'Cada músico a ×4 con Alexander al lado para la escala (4 cuadros: el pulso baja el cuerpo en los impares). Tarima con foco, y las dos ventanas (cantante y siluetas) a ×8.');
  var al = alexRef();
  function withA(frames, z) { var w = strip((al ? [al] : []).concat(frames), z); return w; }
  if (Zb.musico) Object.keys(Zb.musico).forEach(function (k) { var f = Zb.musico[k]; d6.appendChild(fig(withA(f, 4), '<b>zombie.musico.' + k + '</b> · ' + f.length + ' cuadros · ' + f[0].width + '×' + f[0].height + ' · ancla ' + f[0].ax + ',' + f[0].ay)); });
  if (Zb.baile) d6.appendChild(fig(withA(Zb.baile, 4), '<b>zombie.baile</b> · ' + Zb.baile.length + ' cuadros · ' + Zb.baile[0].width + '×' + Zb.baile[0].height + ' · ancla ' + Zb.baile[0].ax + ',' + Zb.baile[0].ay));
  if (P.tarima) { var tr = P.tarima; d6.appendChild(fig(show(withAlex(tr), 4), '<b>props.tarima</b> · ' + tr.width + '×' + tr.height + ' · ancla ' + tr.ax + ',' + tr.ay + ' · huella ' + tr.fw + '×' + tr.fh + ' · lamp ' + (tr.lamp ? tr.lamp.x + ',' + tr.lamp.y : '-') + (tr.deck ? ' · deck ' + tr.deck.x0 + '..' + tr.deck.x1 + ', pies ' + tr.deck.feet : ''))); }
  var Fx = S.fx || {};
  if (Fx.cantanteVentana) d6.appendChild(fig(strip(Fx.cantanteVentana, 8), '<b>fx.cantanteVentana</b> · ' + Fx.cantanteVentana.length + ' cuadros · ' + Fx.cantanteVentana[0].width + '×' + Fx.cantanteVentana[0].height));
  if (Fx.siluetaVentana) { d6.appendChild(fig(strip(Fx.siluetaVentana, 8), '<b>fx.siluetaVentana</b> · ' + Fx.siluetaVentana.length + ' cuadros · ' + Fx.siluetaVentana[0].width + '×' + Fx.siluetaVentana[0].height)); d6.appendChild(fig(strip(Fx.siluetaVentana.map(function (c) { return c.sil; }), 8), 'siluetaVentana[i].sil · solo siluetas, sin fondo')); }
  if (Fx.piedra) { var pr = el('div', 'row'); pr.appendChild(show(Fx.piedra, 16)); if (Fx.piedraSombra) pr.appendChild(show(Fx.piedraSombra, 16)); pr.appendChild(show(Fx.piedra, 1)); d6.appendChild(fig(pr, '<b>fx.piedra</b> ' + Fx.piedra.width + '×' + Fx.piedra.height + ' · <b>fx.piedraSombra</b> ' + (Fx.piedraSombra ? Fx.piedraSombra.width + '×' + Fx.piedraSombra.height : '-'))); }
})();

/* ================= CALLE: muestras tileadas (js/sprites/calle.js) =================
   Seccion propia del suelo: (1) 12x8 vereda / sardinel N / pista con raya / berma, a x4;
   (2) escena de 30x17 tiles (480x270) a x2, con cebra, resalto y calcomanias, para juzgar grilla y valores a tamano de juego. */
(function () {
  var T = S.tiles, D = S.decals;
  if (!T || !T.asphalt) return;
  var d = section('s-calle', 'calle: muestras tileadas', 'Arriba: 12×8 tiles (vereda · sardinel N · pista con raya · berma) a ×4, variantes por hash como en el motor. Abajo: escena de 480×270 (30×17 tiles) a ×2 con cebra, resalto, calcomanías y leyendas (sin vehículos ni edificios).');
  function hsh(c, r) { var h = (Math.imul(c, 73856093) ^ Math.imul(r, 19349663)) >>> 0; return (h ^ (h >>> 11)) >>> 0; }
  function pick(a, c, r) { return Array.isArray(a) ? a[hsh(c, r) % a.length] : a; }
  (function () {
    var C = 12, R = 8, cv = px.canvas(C * 16, R * 16), g = cv.getContext('2d');
    var rows = ['sidewalk', 'sidewalk', 'curbN', 'asphalt', 'laneDashH', 'asphalt', 'berma', 'berma'];
    for (var r = 0; r < R; r++) for (var c = 0; c < C; c++) g.drawImage(pick(T[rows[r]], c, r), c * 16, r * 16);
    d.appendChild(fig(show(cv, 4), '<b>12×8</b> · vereda, vereda, curbN, asfalto, laneDashH, asfalto, berma, berma'));
  })();
  (function () {
    var C = 30, R = 17, cv = px.canvas(C * 16, R * 16), g = cv.getContext('2d'), r, c;
    var map = ['sidewalk', 'sidewalk', 'sidewalk', 'curbN', 'asphalt', 'asphalt', 'asphalt', 'laneDashH', 'laneDashH', 'asphalt', 'asphalt', 'asphalt', 'bermaN', 'berma', 'berma', 'bermaS', 'asphalt'];
    for (r = 0; r < R; r++) for (c = 0; c < C; c++) {
      var name = map[r];
      if (r >= 4 && r <= 11 && c >= 11 && c <= 14) name = 'zebraH';
      if (r >= 4 && r <= 11 && c === 23) name = 'humpV';
      var t = (name === 'asphalt' && hsh(c, r) % 100 < 8) ? T.asphaltCrack : T[name];
      g.drawImage(pick(t, c, r), c * 16, r * 16);
    }
